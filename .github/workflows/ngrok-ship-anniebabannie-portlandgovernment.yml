# ngrok ship manages this workflow. Ship opens a pull request whenever its
# template changes. To take over the file and stop those pull requests, add
# the line "# ngrok-ship: pipeline-updates disabled" anywhere in it.

name: "Build and Push Container (portlandgovernment / app_3LCOHDgQKxBic8OIpbpbjqav4Fi)"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_REFERENCE: "registry.ship.ngrok.com/ac_3egzhhvbofjjeernvloocel0bpp/app_3lcohdgqkxbic8oipbpbjqav4fi"
  NGROK_APP_ID: "app_3LCOHDgQKxBic8OIpbpbjqav4Fi"

jobs:
  build-and-push:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"

      - uses: "docker/login-action@v4"
        with:
          registry: "registry.ship.ngrok.com"
          username: "creg_3Hp2yMeCNEwNsvUblJUWV0yFmuc"
          password: "${{ secrets.NGROK_REGISTRY_PASSWORD_CREG_3HP2YMECNEWNSVUBLJUWV0YFMUC }}"

      - id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: "${{ env.IMAGE_REFERENCE }}"
          tags: |
            type=sha,format=long,prefix=

      - uses: "docker/build-push-action@v7"
        with:
          context: "."
          file: "Dockerfile"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: "Write image reference"
        run: |
          cat <<EOF > ngrok-image.json
          {"image":"${{ steps.meta.outputs.tags }}","commit_sha":"${{ github.sha }}"}
          EOF

      - uses: "actions/upload-artifact@v7"
        with:
          name: "ngrok-compute-image"
          path: "ngrok-image.json"
